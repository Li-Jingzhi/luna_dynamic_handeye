    fy: 975.2351776072
    cx: 1278.0756357403
    cy: 995.0912971747
    k1: 0.6933816749
    k2: 0.3649263406
    k3: 0.0098392884
    k4: 0.7918527853
    k5: 0.5006976367
    k6: 0.0620797063
    p1: -0.0000399129
    p2: -0.0000587533
