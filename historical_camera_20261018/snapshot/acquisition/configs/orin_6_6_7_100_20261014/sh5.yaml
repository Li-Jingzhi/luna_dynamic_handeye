camera_profile:
  model: "sh5"
  input_width: 2560
  input_height: 1984
  # Per-camera H.264 output. VIC scales NVMM frames before NVENC.
  h264_output_width: 1280
  h264_output_height: 720
  fps: 30
  fit_mode: "stretch"
  csi:
    ae_antibanding: 0  # 0=off, 1=auto, 2=50Hz, 3=60Hz
    wb_mode: 1         # nvarguscamerasrc wbmode: 1=auto
    ae_lock: true
    ae_lock_delay_s: 5.0
    awb_lock: true
    awb_lock_delay_s: 5.0
  depth:
    enabled: false
  calibration:
    enabled: true
