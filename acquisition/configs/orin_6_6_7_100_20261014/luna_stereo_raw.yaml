quad_csi_quickview:
  ros__parameters:
    camera:
      head_depth: false
      head_left:
        flip_method: false
        h264_output_height: 720
        h264_output_width: 1280
        profile: sh5
        source: csi://0
      head_right:
        flip_method: false
        h264_output_height: 720
        h264_output_width: 1280
        profile: sh5
        source: csi://1
      wrist_left:
        flip_method: true
        h264_output_height: 720
        h264_output_width: 1280
        profile: sh5
        source: none
      wrist_right:
        flip_method: true
        h264_output_height: 720
        h264_output_width: 1280
        profile: sh5
        source: none
    camera_profiles:
      d405: /opt/kernelmind/apex/install/gmsl_quadcam/share/gmsl_quadcam/config/camera_profiles/d405.yaml
      s56: /opt/kernelmind/apex/install/gmsl_quadcam/share/gmsl_quadcam/config/camera_profiles/s56.yaml
      sh3: /opt/kernelmind/apex/install/gmsl_quadcam/share/gmsl_quadcam/config/camera_profiles/sh3.yaml
      sh5: /opt/kernelmind/apex/install/gmsl_quadcam/share/gmsl_quadcam/config/camera_profiles/sh5.yaml
    diagnostics:
      capture_fps_log_interval_s: 0.0
    mjpeg:
      output_height: 360
      output_width: 640
      publish: true
      quality: 55
    mosaic:
      fps: 30
      output_height: 2160
      output_width: 3840
      show_timestamp: false
    outputs:
      camera_stream_codec: h264
      h264_bitrate: 8000000
      h264_gop: 30
      mjpeg_quality: 55
      publish_depth_raw: false
      publish_h264_undistorted: false
      publish_only_with_subscribers: true
      publish_raw_nv12: true
      publish_undistorted_nv12: false
    recorder:
      bitrate: 20000000
      directory: /media/marvin/BAG_STORAGE/recorded_bags
      gop: 60
      max_bagfile_duration: 600
      max_bagfile_size: 2147483648
      output_height: 1080
      output_width: 1920
    recovery:
      argus_restart_after_container_failures: 1
      argus_restart_command:
      - /usr/bin/sudo
      - -n
      - /usr/bin/systemctl
      - restart
      - nvargus-daemon.service
      argus_restart_enabled: true
      argus_restart_max_attempts: 1
      argus_restart_settle_s: 3.0
      argus_restart_timeout_s: 20.0
      container_backoff_multiplier: 2.0
      container_max_restart_delay_s: 30.0
      container_max_restarts: 3
      container_restart_delay_s: 5.0
      container_restart_window_s: 300.0
      exit_container_on_failure: true
      low_fps_ratio: 0.5
      low_fps_window_s: 10.0
      max_attempts: 2
      operation_timeout_s: 30.0
    webrtc:
      bitrate: 8242880
      gop: 60
      max_bitrate: 12000000
      min_bitrate: 2000000
      output_height: 1488
      output_width: 1920
      publish_h264: true
      room_ids:
      - '10'
      - '11'
      - '12'
      signal_url: ws://127.0.0.1:8554
